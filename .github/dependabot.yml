version: 2
updates:
  # Actions are pinned by commit SHA. Dependabot moves the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Minor and patch updates share one pull request. Major versions change APIs and are done as planned upgrades,
  # so version updates skip them; security updates still come, whatever the version.
  # Tauri's crates and npm packages must stay on the same minor version, so merge both Tauri pull requests together.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      tauri:
        patterns: [tauri, "tauri-*"]
      rust:
        patterns: ["*"]
        update-types: [minor, patch]

  # The pnpm workspace's lockfile at the root covers ui/ too; watching /ui as well opened every update twice.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
