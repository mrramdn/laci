name: Check and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push cancels the older run of the same pull request. Runs on main and manual runs each get a group of
# their own, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Overrides `jobs = 2` in .cargo/config.toml; "default" means one job per CPU.
  CARGO_BUILD_JOBS: default
  # Colour cargo's output in the logs.
  CARGO_TERM_COLOR: always

jobs:
  # A pull request that only changes *.md or docs/** skips the build jobs. Anything else builds.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          # A pull request is checked out as a merge commit: HEAD^1 is the base, HEAD^2 the branch.
          if [ "$EVENT" = pull_request ] && git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            files="$(git diff --name-only --no-renames 'HEAD^1' HEAD)"
            echo "$files"
            if [ -n "$files" ] && ! grep -qvE '^docs/|\.md$' <<< "$files"; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # rust-toolchain.toml sets the version, the profile and the components.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf git libglib2.0-bin xdg-utils webkit2gtk-driver xvfb rpm libarchive-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui typecheck
      - run: pnpm -C ui lint
      - run: cargo fmt --all -- --check
      - run: pnpm -C ui build
      # After the build: one of its tests checks that no preview code is in ui/dist.
      - run: node scripts/ui-state-smoke.mjs
      - run: cargo clippy --workspace --all-targets --features custom-protocol -- -D warnings
      - run: cargo test --workspace --features custom-protocol
      - run: cargo build -p laci --features custom-protocol
      - run: node scripts/mcp-smoke.mjs target/debug/laci
      # THIRD_PARTY_NOTICES.md must list what the lockfiles bring in; `pnpm notices` writes it again.
      - run: node scripts/notices.mjs --check
      - name: Native window smoke check
        env:
          LACI_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/laci-smoke-diagnostics
        run: |
          cargo install tauri-driver --locked
          # GIO compares the source filesystem with the real HOME when choosing Trash.
          laci_fixture_dir="$(mktemp -d "$HOME/laci-desktop-qa.XXXXXX")"
          trap 'rm -rf "$laci_fixture_dir"' EXIT
          export LACI_HOME="$laci_fixture_dir/home"
          node scripts/demo.ts "$LACI_HOME"
          for laci_suite in onboarding watcher full; do
            xvfb-run -a dbus-run-session -- bash scripts/native-smoke.sh target/debug/laci "$laci_suite"
          done
      - run: pnpm build
      - name: Validate production packages
        run: node scripts/package-smoke.mjs /tmp/laci-package-proof
      - name: Native production package regression
        env:
          LACI_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/laci-smoke-diagnostics
        run: |
          laci_fixture_dir="$(mktemp -d "$HOME/laci-packaged-qa.XXXXXX")"
          trap 'rm -rf "$laci_fixture_dir"' EXIT
          export LACI_HOME="$laci_fixture_dir/home"
          node scripts/demo.ts "$LACI_HOME"
          for laci_suite in onboarding watcher modular; do
            xvfb-run -a dbus-run-session -- bash scripts/native-smoke.sh /tmp/laci-package-proof/appimage/squashfs-root/AppRun "$laci_suite"
          done
      - name: Upload native smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laci-smoke-diagnostics
          path: ${{ runner.temp }}/laci-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      # Pull requests build and check the packages but don't keep them.
      - name: Upload packages
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laci-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  # Windows and macOS only report for now: a failure doesn't fail the run or ci-ok until the repository
  # variable REQUIRE_CROSS_PLATFORM is "true". While the repository is private they run on main, on manual
  # runs and on pull requests labelled "cross-platform" (a label added to an open pull request takes effect
  # on its next push). Once it is public they run on every pull request.
  windows:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' ||
        !github.event.repository.private ||
        contains(github.event.pull_request.labels.*.name, 'cross-platform')
      )
    runs-on: windows-2025
    continue-on-error: ${{ vars.REQUIRE_CROSS_PLATFORM != 'true' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      # tauri-build embeds ui/dist.
      - run: pnpm -C ui build
      - run: cargo check --workspace --all-targets --features custom-protocol
      - run: cargo clippy --workspace --all-targets --features custom-protocol -- -D warnings

  macos:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' ||
        !github.event.repository.private ||
        contains(github.event.pull_request.labels.*.name, 'cross-platform')
      )
    runs-on: macos-26
    continue-on-error: ${{ vars.REQUIRE_CROSS_PLATFORM != 'true' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      # tauri-build embeds ui/dist.
      - run: pnpm -C ui build
      - run: cargo check --workspace --all-targets --features custom-protocol
        env:
          TMPDIR: ${{ runner.temp }}
      - run: cargo clippy --workspace --all-targets --features custom-protocol -- -D warnings
        env:
          TMPDIR: ${{ runner.temp }}

  # The one check to require. List every job in needs. A skipped job is fine; a failed or cancelled one is not.
  ci-ok:
    needs: [changes, linux, windows, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRE_CROSS_PLATFORM: ${{ vars.REQUIRE_CROSS_PLATFORM == 'true' }}
        run: |
          status=0
          while read -r job result; do
            case "$job" in
              windows | macos)
                if [ "$REQUIRE_CROSS_PLATFORM" != true ]; then
                  echo "$job: $result (not required)"
                  continue
                fi
                ;;
            esac
            case "$result" in
              success | skipped) echo "$job: $result" ;;
              *)
                echo "::error::$job: $result"
                status=1
                ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          exit "$status"
