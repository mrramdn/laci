name: Check and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push cancels the older run of the same pull request. Runs on main and manual runs each get a group of
# their own, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Overrides `jobs = 2` in .cargo/config.toml; "default" means one job per CPU.
  CARGO_BUILD_JOBS: default
  # Colour cargo's output in the logs.
  CARGO_TERM_COLOR: always

jobs:
  # A pull request that only changes *.md or docs/** skips the build jobs. Anything else builds, and so does
  # docs/brand/src: brand-check compares it with what scripts/brand-icons.mjs writes.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          # A pull request is checked out as a merge commit: HEAD^1 is the base, HEAD^2 the branch.
          if [ "$EVENT" = pull_request ] && git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            files="$(git diff --name-only --no-renames 'HEAD^1' HEAD)"
            echo "$files"
            if [ -n "$files" ] && ! grep -qvE '^docs/|\.md$' <<< "$files" && ! grep -q '^docs/brand/src/' <<< "$files"; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # rust-toolchain.toml sets the version, the profile and the components.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf git libglib2.0-bin xdg-utils webkit2gtk-driver xvfb rpm libarchive-tools
      - run: pnpm install --frozen-lockfile
      # The app icons and what the Tauri configs list. Ubuntu 24.04 packages neither resvg nor ImageMagick 7,
      # so the comparison with a fresh render is skipped here; the other checks run.
      - run: node scripts/brand-check.mjs
      - run: pnpm -C ui typecheck
      - run: pnpm -C ui lint
      - run: cargo fmt --all -- --check
      - run: pnpm -C ui build
      # After the build: one of its tests checks that no preview code is in ui/dist.
      - run: node scripts/ui-state-smoke.mjs
      - run: cargo clippy --workspace --all-targets --features custom-protocol -- -D warnings
      - run: cargo test --workspace --features custom-protocol
      - run: cargo build -p laci --features custom-protocol
      - run: node scripts/mcp-smoke.mjs target/debug/laci
      # THIRD_PARTY_NOTICES.md must list what the lockfiles bring in; `pnpm notices` writes it again. Dependabot
      # can't run it, so its pull requests only warn here; the release workflow refuses stale notices.
      - name: Third-party notices are current
        continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
        run: node scripts/notices.mjs --check
      - name: Native window smoke check
        env:
          LACI_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/laci-smoke-diagnostics
        run: |
          cargo install tauri-driver --locked
          # GIO compares the source filesystem with the real HOME when choosing Trash.
          laci_fixture_dir="$(mktemp -d "$HOME/laci-desktop-qa.XXXXXX")"
          trap 'rm -rf "$laci_fixture_dir"' EXIT
          export LACI_HOME="$laci_fixture_dir/home"
          node scripts/demo.ts "$LACI_HOME"
          for laci_suite in onboarding watcher full; do
            xvfb-run -a dbus-run-session -- bash scripts/native-smoke.sh target/debug/laci "$laci_suite"
          done
      - run: pnpm build
      # The WebDriver server lets anything on this computer drive the window: only `--features e2e` brings it in,
      # and no release build may have it. A binary with the plugin holds its name, "wdio-webdriver"; the four
      # letters "wdio" alone could turn up in compressed data by chance.
      - name: No WebDriver server in release builds
        run: |
          if tree="$(cargo tree --target all -p laci --features custom-protocol -i tauri-plugin-wdio-webdriver 2>&1)" \
            || ! grep -q 'did not match any packages' <<< "$tree"; then
            echo "$tree"
            echo "::error::tauri-plugin-wdio-webdriver is in the release build's dependencies"
            exit 1
          fi
          if grep -qaF wdio-webdriver target/release/laci; then
            echo "::error::The release binary holds the WebDriver plugin"
            exit 1
          fi
      - name: Validate production packages
        run: node scripts/package-smoke.mjs /tmp/laci-package-proof
      - name: Native production package regression
        env:
          LACI_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/laci-smoke-diagnostics
        run: |
          laci_fixture_dir="$(mktemp -d "$HOME/laci-packaged-qa.XXXXXX")"
          trap 'rm -rf "$laci_fixture_dir"' EXIT
          export LACI_HOME="$laci_fixture_dir/home"
          node scripts/demo.ts "$LACI_HOME"
          for laci_suite in onboarding watcher modular; do
            xvfb-run -a dbus-run-session -- bash scripts/native-smoke.sh /tmp/laci-package-proof/appimage/squashfs-root/AppRun "$laci_suite"
          done
      - name: Upload native smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laci-smoke-diagnostics
          path: ${{ runner.temp }}/laci-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      # Pull requests build and check the packages but don't keep them.
      - name: Upload packages
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laci-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  # Windows and macOS only report for now: a failure doesn't fail the run or ci-ok until the repository
  # variable REQUIRE_CROSS_PLATFORM is "true". While the repository is private they run on main, on manual
  # runs and on pull requests labelled "cross-platform" (a label added to an open pull request takes effect
  # on its next push). Once it is public they run on every pull request.
  windows:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' ||
        !github.event.repository.private ||
        contains(github.event.pull_request.labels.*.name, 'cross-platform')
      )
    runs-on: windows-2025
    continue-on-error: ${{ vars.REQUIRE_CROSS_PLATFORM != 'true' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      # tauri-build embeds ui/dist.
      - run: pnpm -C ui build
      - run: cargo check --workspace --all-targets --features custom-protocol
      - run: cargo clippy --workspace --all-targets --features custom-protocol -- -D warnings
      # The tests must build. Until the port's steps for folders, paths, processes and the Recycle Bin land (M4 and
      # M5), many of them are refused on Windows, as they should be, so running them only reports how far it got.
      - run: cargo test --workspace --features custom-protocol --no-run
      - name: cargo test (a report until the port lands)
        run: cargo test --workspace --features custom-protocol --no-fail-fast
        continue-on-error: true
        timeout-minutes: 15
      - run: cargo build -p laci --features custom-protocol
      # mcp-smoke checks that the file it is given exists, so the name ends in .exe. Its moves need port:P5.
      - name: MCP smoke (a report until port:P5)
        run: node scripts/mcp-smoke.mjs target/debug/laci.exe
        continue-on-error: true
        timeout-minutes: 5
      # The checks that keep Laci off files other programs have open already pass here, and only Windows can run
      # them, so a failure turns this job red. Last, so the report above still runs when they fail.
      - name: cargo test (process guards)
        run: cargo test --workspace --features custom-protocol --test process_guards
        timeout-minutes: 10

  macos:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' ||
        !github.event.repository.private ||
        contains(github.event.pull_request.labels.*.name, 'cross-platform')
      )
    runs-on: macos-26
    continue-on-error: ${{ vars.REQUIRE_CROSS_PLATFORM != 'true' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      # tauri-build embeds ui/dist.
      - run: pnpm -C ui build
      # TMPDIR: the default one is under /var, a link, and Laci refuses to write through links.
      - run: cargo check --workspace --all-targets --features custom-protocol
        env:
          TMPDIR: ${{ runner.temp }}
      - run: cargo clippy --workspace --all-targets --features custom-protocol -- -D warnings
        env:
          TMPDIR: ${{ runner.temp }}
      # The tests that need port:P5's check of which programs use a folder are ignored outside Linux until then.
      - run: cargo test --workspace --features custom-protocol
        env:
          TMPDIR: ${{ runner.temp }}
      - run: cargo build -p laci --features custom-protocol
      # Its moves need port:P5 too.
      - name: MCP smoke (a report until port:P5)
        run: node scripts/mcp-smoke.mjs target/debug/laci
        continue-on-error: true
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}

  # Screenshots of the real window (scripts/window-smoke.mjs): both designs, both themes, the four widths of Simple's
  # tiers, from a build with the WebDriver server (`--features e2e`). Linux and Windows drive it through tauri-driver,
  # macOS through the server inside the app. It only reports, on every OS: a failure never fails the run. The
  # screenshots are kept as screenshots-<OS> for 7 days. Gated like the Windows and macOS jobs.
  window-smoke:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' ||
        !github.event.repository.private ||
        contains(github.event.pull_request.labels.*.name, 'cross-platform')
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      # Reads the cache the other jobs save; the e2e build would only add its own features to it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}
          save-if: false
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf git libglib2.0-bin xdg-utils webkit2gtk-driver xvfb
      - run: pnpm install --frozen-lockfile
      # tauri-build embeds ui/dist.
      - run: pnpm -C ui build
      # TMPDIR on macOS: the default one is under /var, a link, and Laci refuses to write through links.
      - name: Build with the WebDriver server
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export TMPDIR="$RUNNER_TEMP"; fi
          cargo build -p laci --features custom-protocol,e2e
      # The linux job's release guard looks for this name; a build with the plugin must hold it.
      - name: The guard would see the WebDriver server
        if: runner.os == 'Linux'
        run: grep -qaF wdio-webdriver target/debug/laci
      - name: tauri-driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked
      # msedgedriver has to match the WebView2 runtime the app runs in, which can differ from Edge's. Without a
      # download, the runner's own one (EDGEWEBDRIVER, for Edge) is the next best.
      - name: msedgedriver for the installed WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKCU:\Software\$client") |
            ForEach-Object { (Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'No WebView2 runtime is installed' }
          Write-Host "WebView2 $version"
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath $dir
            $driver = Join-Path $dir 'msedgedriver.exe'
          } catch {
            Write-Warning "No msedgedriver $version to download ($_); using the runner's, made for Edge"
            $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          }
          "LACI_NATIVE_DRIVER=$driver" >> $env:GITHUB_ENV
      - name: Window screenshots
        shell: bash
        env:
          LACI_SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: |
          LACI_HOME="$(node -p "require('node:path').join(process.env.RUNNER_TEMP, 'laci-window', 'home')")"
          export LACI_HOME
          node scripts/demo.ts "$LACI_HOME"
          case "$RUNNER_OS" in
            Linux)
              xvfb-run -a -s '-screen 0 1920x1200x24' dbus-run-session -- node scripts/window-smoke.mjs target/debug/laci
              ;;
            Windows) node scripts/window-smoke.mjs target/debug/laci.exe ;;
            macOS) TMPDIR="$RUNNER_TEMP" node scripts/window-smoke.mjs target/debug/laci ;;
          esac
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ runner.os }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 7

  # The one check to require. List every job in needs, except window-smoke, which only reports and can take an hour.
  # A skipped job is fine; a failed or cancelled one is not.
  ci-ok:
    needs: [changes, linux, windows, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRE_CROSS_PLATFORM: ${{ vars.REQUIRE_CROSS_PLATFORM == 'true' }}
        run: |
          status=0
          while read -r job result; do
            case "$job" in
              windows | macos)
                if [ "$REQUIRE_CROSS_PLATFORM" != true ]; then
                  echo "$job: $result (not required)"
                  continue
                fi
                ;;
            esac
            case "$result" in
              success | skipped) echo "$job: $result" ;;
              *)
                echo "::error::$job: $result"
                status=1
                ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          exit "$status"
