name: Check and package
on:
  pull_request:
  push:
    branches: [main]
  # A manual run can leave out the screenshots of the window (`-f window_smoke=false`).
  workflow_dispatch:
    inputs:
      window_smoke:
        description: Take screenshots of the real window too
        type: boolean
        default: true

# A new push cancels the older run of the same pull request. Runs on main and manual runs each get a group of
# their own, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Overrides `jobs = 2` in .cargo/config.toml; "default" means one job per CPU.
  CARGO_BUILD_JOBS: default
  # Colour cargo's output in the logs.
  CARGO_TERM_COLOR: always

jobs:
  # A pull request that only changes *.md or docs/** skips the build jobs. Anything else builds, and so does
  # docs/brand/src: brand-check compares it with what scripts/brand-icons.mjs writes.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          # A pull request is checked out as a merge commit: HEAD^1 is the base, HEAD^2 the branch.
          if [ "$EVENT" = pull_request ] && git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            files="$(git diff --name-only --no-renames 'HEAD^1' HEAD)"
            echo "$files"
            if [ -n "$files" ] && ! grep -qvE '^docs/|\.md$' <<< "$files" && ! grep -q '^docs/brand/src/' <<< "$files"; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # rust-toolchain.toml sets the version, the profile and the components.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf git libglib2.0-bin xdg-utils webkit2gtk-driver xvfb rpm libarchive-tools
      - run: pnpm install --frozen-lockfile
      # The app icons and what the Tauri configs list. Ubuntu 24.04 packages neither resvg nor ImageMagick 7,
      # so the comparison with a fresh render is skipped here; the other checks run.
      - run: node scripts/brand-check.mjs
      - run: pnpm -C ui typecheck
      - run: pnpm -C ui lint
      - run: cargo fmt --all -- --check
      # The workspace denies unsafe code (Cargo.toml's lints), and nothing allows it. An allow, or a crate that stops
      # using the workspace's lints, fails here.
      - name: No unsafe code
        run: |
          if found="$(grep -rl unsafe_code crates src-tauri)"; then
            echo "::error::Only the workspace's Cargo.toml may mention unsafe_code, to deny it; these do too:"
            echo "$found"
            exit 1
          fi
          grep -qx 'unsafe_code = "deny"' Cargo.toml || { echo '::error::Cargo.toml no longer denies unsafe_code'; exit 1; }
          for manifest in crates/laci-core/Cargo.toml src-tauri/Cargo.toml; do
            grep -A1 -x '\[lints\]' "$manifest" | grep -qx 'workspace = true' \
              || { echo "::error::$manifest doesn't use the workspace's lints"; exit 1; }
          done
      - run: pnpm -C ui build
      # After the build: one of its tests checks that no preview code is in ui/dist.
      - run: node scripts/ui-state-smoke.mjs
      - run: cargo clippy --workspace --all-targets --features custom-protocol -- -D warnings
      - run: cargo test --workspace --features custom-protocol
      - run: cargo build -p laci --features custom-protocol
      - run: node scripts/mcp-smoke.mjs target/debug/laci
      # THIRD_PARTY_NOTICES.md must list what the lockfiles bring in; `pnpm notices` writes it again. Dependabot
      # can't run it, so its pull requests only warn here; the release workflow refuses stale notices.
      - name: Third-party notices are current
        continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
        run: node scripts/notices.mjs --check
      - name: Native window smoke check
        env:
          LACI_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/laci-smoke-diagnostics
        run: |
          cargo install tauri-driver --locked
          # GIO compares the source filesystem with the real HOME when choosing Trash.
          laci_fixture_dir="$(mktemp -d "$HOME/laci-desktop-qa.XXXXXX")"
          trap 'rm -rf "$laci_fixture_dir"' EXIT
          export LACI_HOME="$laci_fixture_dir/home"
          node scripts/demo.ts "$LACI_HOME"
          for laci_suite in onboarding watcher full simple; do
            xvfb-run -a dbus-run-session -- bash scripts/native-smoke.sh target/debug/laci "$laci_suite"
          done
      - run: pnpm build
      # The WebDriver server lets anything on this computer drive the window: only `--features e2e` brings it in,
      # and no release build may have it. A binary with the plugin holds its name, "wdio-webdriver"; the four
      # letters "wdio" alone could turn up in compressed data by chance.
      - name: No WebDriver server in release builds
        run: |
          if tree="$(cargo tree --target all -p laci --features custom-protocol -i tauri-plugin-wdio-webdriver 2>&1)" \
            || ! grep -q 'did not match any packages' <<< "$tree"; then
            echo "$tree"
            echo "::error::tauri-plugin-wdio-webdriver is in the release build's dependencies"
            exit 1
          fi
          if grep -qaF wdio-webdriver target/release/laci; then
            echo "::error::The release binary holds the WebDriver plugin"
            exit 1
          fi
      - name: Validate production packages
        run: node scripts/package-smoke.mjs /tmp/laci-package-proof
      - name: Native production package regression
        env:
          LACI_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/laci-smoke-diagnostics
        run: |
          laci_fixture_dir="$(mktemp -d "$HOME/laci-packaged-qa.XXXXXX")"
          trap 'rm -rf "$laci_fixture_dir"' EXIT
          export LACI_HOME="$laci_fixture_dir/home"
          node scripts/demo.ts "$LACI_HOME"
          for laci_suite in onboarding watcher modular; do
            xvfb-run -a dbus-run-session -- bash scripts/native-smoke.sh /tmp/laci-package-proof/appimage/squashfs-root/AppRun "$laci_suite"
          done
      - name: Upload native smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laci-smoke-diagnostics
          path: ${{ runner.temp }}/laci-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      # Only runs on main keep the packages. Pull requests and manual runs on other branches build and check them
      # but don't keep them.
      - name: Upload packages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laci-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  # Screenshots of the real window (scripts/window-smoke.mjs): both designs, both themes, the four widths of Simple's
  # tiers, from a build with the WebDriver server (`--features e2e`), driven through tauri-driver. It only reports: a
  # failure never fails the run. The screenshots are kept as screenshots-Linux for 7 days. A manual run can leave it
  # out; on a push or a pull request the input is empty, and it runs.
  window-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'workflow_dispatch' || inputs.window_smoke)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      # Reads the cache the other jobs save; the e2e build would only add its own features to it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}
          save-if: false
      - name: Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf git libglib2.0-bin xdg-utils webkit2gtk-driver xvfb
      - run: pnpm install --frozen-lockfile
      # tauri-build embeds ui/dist.
      - run: pnpm -C ui build
      - name: Build with the WebDriver server
        run: cargo build -p laci --features custom-protocol,e2e
      # The linux job's release guard looks for this name; a build with the plugin must hold it.
      - name: The guard would see the WebDriver server
        run: grep -qaF wdio-webdriver target/debug/laci
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: Window screenshots
        shell: bash
        # A run takes a few minutes. One that hangs ends here instead of at the job's hour.
        timeout-minutes: 15
        env:
          LACI_SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: |
          LACI_HOME="$(node -p "require('node:path').join(process.env.RUNNER_TEMP, 'laci-window', 'home')")"
          export LACI_HOME
          node scripts/demo.ts "$LACI_HOME"
          xvfb-run -a -s '-screen 0 1920x1200x24' dbus-run-session -- node scripts/window-smoke.mjs target/debug/laci
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ runner.os }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 7

  # The one check to require. List every job in needs, except window-smoke, which only reports and can take an hour.
  # A skipped job is fine; a failed or cancelled one is not.
  ci-ok:
    needs: [changes, linux]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          status=0
          while read -r job result; do
            case "$result" in
              success | skipped) echo "$job: $result" ;;
              *)
                echo "::error::$job: $result"
                status=1
                ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          exit "$status"
