name: Release
# A tag v<version> on main or a release/* branch becomes a DRAFT release with the AppImage, the updater's signature
# of it, the deb, the rpm, latest.json, SHA256SUMS and provenance.json, each with a build provenance attestation.
# rifkii checks the draft and publishes it; nothing here publishes. RELEASING.md has the steps.
#
# Every other run is a dry run: a manual run on any branch (or tag), and a pull request that changes the release
# workflow or its scripts. It has the same checks, build and tests, signed with a throwaway key made in the run, and
# keeps the would-be assets as the artifact laci-release-<version>: no environment, no attestation, no release.
# `-f version=3.0.0-rc.1` builds as that version, to try a release candidate's names before tagging it.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
  workflow_dispatch:
    inputs:
      version:
        description: Dry run only. Build as this version instead of the one in Cargo.toml, e.g. 3.0.0-rc.1
        type: string
        default: ""

# Each job asks for what it needs.
permissions: {}

# One run per tag or branch at a time, and none is cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: default
  CARGO_TERM_COLOR: always

jobs:
  # The tag names the version every file holds, its commit is on main or release/*, CHANGELOG.md has the notes and
  # THIRD_PARTY_NOTICES.md is current. Stale notices refuse the release.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      # Every branch, to see which ones hold the commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No caches in release runs: what they build comes from the lockfiles alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Release scripts' tests
        run: node --test scripts/release/release.test.mjs
      - name: Third-party notices are current
        run: node scripts/notices.mjs --check
      - name: Tag, versions, branch and changelog
        id: release
        env:
          RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$RELEASE" = true ]; then
            node scripts/release/verify.mjs --tag "$TAG" --commit "$GITHUB_SHA"
          elif [ -n "$VERSION" ]; then
            node scripts/release/verify.mjs --dry-run --commit "$GITHUB_SHA" --version "$VERSION"
          else
            node scripts/release/verify.mjs --dry-run --commit "$GITHUB_SHA"
          fi

  # Ubuntu 22.04 sets the oldest glibc the packages run on (Ubuntu 22.04, Mint 21, Debian 12). The tests are
  # check.yml's for packages: package-smoke and the packaged AppImage's native regression.
  build:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      glibc: ${{ steps.glibc.outputs.floor }}
      runner: ${{ steps.glibc.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf git libglib2.0-bin xdg-utils webkit2gtk-driver xvfb rpm libarchive-tools
      - run: pnpm install --frozen-lockfile
      - name: Build as the dry run's version
        if: ${{ !(github.event_name == 'push' && github.ref_type == 'tag') && inputs.version != '' }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/release/version.mjs set "$VERSION"
      # tauri.conf.json leaves bundle.createUpdaterArtifacts off, so this build needs no key: the sign job signs the
      # AppImage afterwards, in the release environment.
      - name: Build the packages
        run: pnpm build
      - name: No WebDriver server in release builds
        run: |
          if tree="$(cargo tree --target all -p laci --features custom-protocol -i tauri-plugin-wdio-webdriver 2>&1)" \
            || ! grep -q 'did not match any packages' <<< "$tree"; then
            echo "$tree"
            echo "::error::tauri-plugin-wdio-webdriver is in the release build's dependencies"
            exit 1
          fi
          if grep -qaF wdio-webdriver target/release/laci; then
            echo "::error::The release binary holds the WebDriver plugin"
            exit 1
          fi
      - name: Validate production packages
        run: node scripts/package-smoke.mjs /tmp/laci-package-proof
      # The binary's own floor holds for the deb and rpm, which use the system's libraries. The AppImage carries
      # this runner's WebKitGTK and its other libraries, which can need a newer glibc; the release states the newer.
      - name: The oldest glibc the packages run on
        id: glibc
        run: |
          floor() { grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | sed 's/^GLIBC_//'; }
          binary="$(objdump -T target/release/laci | floor)"
          # Some of the files are scripts, which objdump refuses.
          appimage="$({ find /tmp/laci-package-proof/appimage/squashfs-root -type f \( -name '*.so*' -o -perm -u+x \) \
            -exec objdump -T {} + 2> /dev/null || true; } | floor)"
          test -n "$binary" && test -n "$appimage"
          both="$(printf '%s\n' "$binary" "$appimage" | sort -V | tail -1)"
          . /etc/os-release
          echo "floor=$both" >> "$GITHUB_OUTPUT"
          echo "runner=ubuntu-$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "Built on ubuntu-$VERSION_ID (image $ImageVersion). The binary needs glibc $binary or newer, the AppImage with its libraries $appimage." \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # The packages the sign job signs are uploaded here, before anything is installed only for testing them: nothing
      # that runs after this step can change them.
      - name: Gather the packages
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
            "$RUNNER_TEMP/packages/"
          ls -l "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
          retention-days: 7
      # A tool from crates.io, outside the lockfiles: an exact version, which the run installs after the upload above.
      - name: tauri-driver
        run: cargo install tauri-driver --locked --version 2.1.0
      - name: Native production package regression
        env:
          LACI_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/laci-smoke-diagnostics
        run: |
          laci_fixture_dir="$(mktemp -d "$HOME/laci-packaged-qa.XXXXXX")"
          trap 'rm -rf "$laci_fixture_dir"' EXIT
          export LACI_HOME="$laci_fixture_dir/home"
          node scripts/demo.ts "$LACI_HOME"
          for laci_suite in onboarding watcher modular; do
            xvfb-run -a dbus-run-session -- bash scripts/native-smoke.sh /tmp/laci-package-proof/appimage/squashfs-root/AppRun "$laci_suite"
          done
      - name: Upload native smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laci-smoke-diagnostics
          path: ${{ runner.temp }}/laci-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 14

  # The deb installed by apt on Ubuntu 22.04 and the rpm by dnf on Fedora, each with the dependencies it names, then
  # `laci --version` from each. A runner of its own, without the build's files.
  install:
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: The deb with apt
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "$RUNNER_TEMP/packages/laci_${VERSION}_amd64.deb"
          test "$(laci --version)" = "laci $VERSION"
          echo "apt on ubuntu-22.04: $(laci --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The rpm with dnf
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker run --rm -e VERSION -v "$RUNNER_TEMP/packages:/packages:ro" fedora:latest bash -euc '
            dnf install -y "/packages/laci-${VERSION}-1.x86_64.rpm"
            test "$(laci --version)" = "laci $VERSION"
            echo "dnf on $(cat /etc/fedora-release): $(laci --version)"
          ' | tee /dev/stderr | tail -1 >> "$GITHUB_STEP_SUMMARY"

  # The updater's signature of the AppImage, with the key in the release environment, which rifkii approves. The job
  # runs nothing from the build: only the Tauri CLI of the lockfile, installed without any package's scripts. The key
  # reaches that one step and no file.
  sign:
    needs: [verify, build, install]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Sign the AppImage for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/signature"
          appimage="laci_${VERSION}_amd64.AppImage"
          pnpm exec tauri signer sign --app-version "$VERSION" "$RUNNER_TEMP/packages/$appimage" > /dev/null
          mv "$RUNNER_TEMP/packages/$appimage.sig" "$RUNNER_TEMP/signature/"
      # The key in tauri.conf.json is the one every installed Laci checks updates with.
      - name: Check the signature with the app's public key
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          appimage="laci_${VERSION}_amd64.AppImage"
          node scripts/release/minisign.mjs "$RUNNER_TEMP/packages/$appimage" "$RUNNER_TEMP/signature/$appimage.sig" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: ${{ runner.temp }}/signature
          if-no-files-found: error
          retention-days: 7

  # The dry run's sign job: the same command, with a throwaway key and password made here, never stored.
  sign-dry-run:
    needs: [verify, build, install]
    if: ${{ !(github.event_name == 'push' && github.ref_type == 'tag') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Sign the AppImage with a throwaway key
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/throwaway" "$RUNNER_TEMP/signature"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          pnpm exec tauri signer generate --ci -p "$password" -w "$RUNNER_TEMP/throwaway/updater.key" > /dev/null
          appimage="laci_${VERSION}_amd64.AppImage"
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway/updater.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$password" \
            pnpm exec tauri signer sign --app-version "$VERSION" "$RUNNER_TEMP/packages/$appimage" > /dev/null
          rm "$RUNNER_TEMP/throwaway/updater.key"
          mv "$RUNNER_TEMP/packages/$appimage.sig" "$RUNNER_TEMP/throwaway/updater.key.pub" "$RUNNER_TEMP/signature/"
      - name: Check the signature with the throwaway public key
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          appimage="laci_${VERSION}_amd64.AppImage"
          node scripts/release/minisign.mjs "$RUNNER_TEMP/packages/$appimage" "$RUNNER_TEMP/signature/$appimage.sig" \
            "$VERSION" "$RUNNER_TEMP/signature/updater.key.pub"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: ${{ runner.temp }}/signature
          if-no-files-found: error
          retention-days: 7

  # latest.json, checked the way the updater reads it, provenance.json and SHA256SUMS of every asset.
  finalize:
    needs: [verify, build, sign, sign-dry-run]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign-dry-run.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: ${{ runner.temp }}/signature
      - name: Assemble the release
        env:
          RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          GLIBC: ${{ needs.build.outputs.glibc }}
          BUILD_RUNNER: ${{ needs.build.outputs.runner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mv "$RUNNER_TEMP"/signature/*.sig "$RUNNER_TEMP/packages/"
          args=(--packages "$RUNNER_TEMP/packages" --out "$RUNNER_TEMP/release" --version "$VERSION" --tag "$TAG"
            --commit "$GITHUB_SHA" --runner "$BUILD_RUNNER" --glibc "$GLIBC" --run-url "$RUN_URL"
            --artifact "laci-release-$VERSION")
          if [ "$RELEASE" != true ]; then
            args+=(--dry-run --public-key "$RUNNER_TEMP/signature/updater.key.pub")
          fi
          node scripts/release/finalize.mjs "${args[@]}"
      - name: Check SHA256SUMS
        working-directory: ${{ runner.temp }}/release/assets
        run: sha256sum -c SHA256SUMS
      - name: The assets
        working-directory: ${{ runner.temp }}/release/assets
        run: |
          {
            echo '```'
            ls -l
            echo
            cat SHA256SUMS
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laci-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14

  # A build provenance attestation for every asset: gh attestation verify <file> -R mrramdn/laci.
  attest:
    needs: [verify, finalize]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: laci-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/assets/*

  # The draft, marked as a pre-release when the version has a "-". rifkii publishes it.
  draft:
    needs: [verify, finalize, attest]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: laci-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          args=(--draft --verify-tag --title "Laci $VERSION" --notes-file "$RUNNER_TEMP/release/notes.md")
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/release/assets/*
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,isDraft,isPrerelease,assets \
            --jq '"\(.name): draft \(.isDraft), pre-release \(.isPrerelease)", (.assets[] | "  \(.name) \(.size)")' \
            | tee -a "$GITHUB_STEP_SUMMARY"
