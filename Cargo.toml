[workspace]
members = ["crates/laci-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "2.5.2"
edition = "2024"
rust-version = "1.98"
publish = false
authors = ["mrramdn <rifki.ramdani330@gmail.com>"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
sha2 = "0.10"
rayon = "1"
walkdir = "2"
tempfile = "3"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.9"
notify = "8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std"] }
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
rustix = { version = "1", features = ["fs", "process"] }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
