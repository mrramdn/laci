[package]
name = "laci-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
regex.workspace = true
chrono.workspace = true
sha1.workspace = true
sha2.workspace = true
rayon.workspace = true
walkdir.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# What macOS and Windows need, added at once so Cargo.lock changes once; some wait for the steps that use them. None
# of them is built for Linux.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
trash = { version = "5", default-features = false }

[target.'cfg(windows)'.dependencies]
dunce = "1"
file-id = "0.2"
open = { version = "5", features = ["shellexecute-on-windows"] }
process-wrap = { version = "10", default-features = false, features = ["std", "job-object", "creation-flags"] }
which = "8"
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
