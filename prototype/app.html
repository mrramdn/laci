/* References: Linear (grouped lists, properties panel, status glyphs), Raycast (palette + key hints), shadcn/Vercel (zinc tokens, Geist). */

  }
}
:root[data-theme="dark"] {
  --bg: #0C0C0D; --sidebar: #0F0F11; --subtle: #131315; --border: #1F1F22; --border-strong: #2B2B2F;

* { box-sizing: border-box; }

    dormant: ring('stroke-dasharray="1.8 2.2"'),
    idea: ring('stroke-dasharray="0.6 2.4"'),
    paused: ring() + `<path d="M5.6 5v4M8.4 5v4" stroke="${c}" stroke-width="1.4" stroke-linecap="round"/>`,
    done: `<circle cx="7" cy="7" r="6.5" fill="${c}"/><path d="m4.5 7.2 1.7 1.7 3.3-3.4" fill="none" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`,
    archived: `<circle cx="7" cy="7" r="6.5" fill="${c}"/><path d="M4.6 7h4.8" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round"/>`,
  }
  return `<svg class="glyph" width="${size}" height="${size}" viewBox="0 0 14 14" aria-label="${esc(v)}">${inner[v] ?? ring()}</svg>`
}
function prioGlyph(p) {
  const n = { low: 1, medium: 2, high: 3 }[p] ?? 0
  if (!n) return `<svg class="glyph" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><g fill="var(--faint)"><circle cx="3" cy="7" r="1.1"/><circle cx="7" cy="7" r="1.1"/><circle cx="11" cy="7" r="1.1"/></g></svg>`
  return `<svg class="glyph" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">${[[1.5, 8.5, 4], [5.75, 5.5, 7], [10, 2.5, 10]].map(([x, y, h], i) => `<rect x="${x}" y="${y}" width="2.5" height="${h}" rx="1" fill="${i < n ? 'var(--text)' : 'var(--border-strong)'}"/>`).join('')}</svg>`
}
function sevGlyph(s) {
  if (s === 'high') return `<svg class="glyph" width="14" height="14" viewBox="0 0 14 14" aria-label="High"><rect x=".5" y=".5" width="13" height="13" rx="3.5" fill="var(--red)"/><path d="M7 3.6v4.1" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="7" cy="10.1" r=".95" fill="#fff"/></svg>`
  if (s === 'med') return `<svg class="glyph" width="14" height="14" viewBox="0 0 14 14" aria-label="Medium"><circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--amber)" stroke-width="1.5"/><path d="M7 4.3v3.2" stroke="var(--amber)" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="9.6" r=".85" fill="var(--amber)"/></svg>`
  return `<svg class="glyph" width="14" height="14" viewBox="0 0 14 14" aria-label="Low"><circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--faint)" stroke-width="1.5"/><circle cx="7" cy="7" r="1.2" fill="var(--faint)"/></svg>`
}

/* ---------- derived ---------- */
const FIX_LABEL = { 'no-remote': 'Create remote', 'no-commits': 'First commit', dirty: 'Review changes', unpushed: 'Push', stash: 'Show stash', 'no-git': 'Start tracking', behind: 'Pull' }
const RISK = new Set(['no-commits', 'no-remote', 'dirty', 'unpushed', 'stash', 'no-git'])
const risky = () => all.flatMap(n => n.issues.filter(i => RISK.has(i.code)).map(i => ({ n, i })))
  .sort((a, b) => (a.i.severity === b.i.severity ? days(a.n.lastActivity?.at) - days(b.n.lastActivity?.at) : a.i.severity === 'high' ? -1 : 1))
const openChecks = () => all.flatMap(n => n.tasks.filter(t => t.kind === 'check' && !t.done).map(t => ({ n, t })))
const handoffs = () => all.flatMap(n => n.taskFiles
  .map(f => ({ n, f, open: n.tasks.filter(t => t.file === f.file && t.kind === 'list' && !t.done).length }))
  .filter(h => h.open && !n.archived))
const hot = () => risky().filter(r => r.i.severity === 'high').length
const fixBtn = (n, code, cls = '') => FIX_LABEL[code] ? `<button class="btn sm ${cls}" data-act="term" data-id="${esc(n.id)}" data-what="fix" data-arg="${esc(code)}">${esc(FIX_LABEL[code])}</button>` : ''

/* ---------- render ---------- */
function render() {
  const keepScroll = $('.main .body')?.scrollTop ?? 0
  const keepInsp = $('.ibody')?.scrollTop ?? 0
  const focused = document.activeElement?.closest?.('[data-id]')?.dataset.id
  if (!$('#main')) {
    app.className = 'app'
    app.innerHTML = '<nav id="side" class="side" aria-label="Sidebar"></nav><main id="main" class="main"></main><aside id="insp" class="insp" aria-label="Details" hidden></aside><section id="term" class="term" aria-label="Terminal" hidden><div class="term-resize" data-resize></div><div class="term-bar"></div><div class="term-body"></div></section>'
  }
  $('#side').innerHTML = side()
  $('#main').innerHTML = main()
  const showInsp = !!(st.sel && nodes[st.sel])
  $('#insp').hidden = !showInsp
  $('#insp').innerHTML = showInsp ? insp() : ''
  renderTermBar()
  document.querySelectorAll('.scrim').forEach(x => x.remove())
  if (st.modal) document.body.insertAdjacentHTML('beforeend', dialog())
  if (st.palette) { document.body.insertAdjacentHTML('beforeend', palette()); const inp = $('#pal-in'); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length) }
  const b = $('.main .body'); if (b && !st.resetScroll) b.scrollTop = keepScroll
  const ib = $('.ibody'); if (ib && !st.resetInsp) ib.scrollTop = keepInsp
  st.resetScroll = st.resetInsp = false
  if (focused && !st.palette && !st.modal) document.querySelector(`.main .item[data-id="${CSS.escape(focused)}"]`)?.focus({ preventScroll: true })
}

function side() {
  const nav = [['today', 'Today', 'inbox', hot(), true], ['tidy', 'Tidy up', 'sparkles', snap.proposals.filter(p => p.action).length], ['agents', 'Agent history', 'history', snap.orphans.claude.length + snap.orphans.items.length]]
  const treeRows = (ids, depth) => ids.map(id => nodes[id]).filter(n => n.kind === 'folder').map(n => {
    const sub = n.children.filter(c => nodes[c].kind === 'folder')
    const open = st.tree.has(n.id)
    const count = descendants(n).filter(d => d.kind === 'project').length
    return `<div class="tree-row" style="padding-left:${depth * 14}px" ${st.view === 'folder' && st.cwd === n.id ? 'aria-current="true"' : ''}>
      ${sub.length ? `<button class="tw" data-act="twist" data-id="${esc(n.id)}" aria-expanded="${open}" aria-label="${open ? 'Collapse' : 'Expand'} ${esc(n.name)}">${icon('chev')}</button>` : '<span class="tw"></span>'}
      <button class="tl" data-act="cd" data-id="${esc(n.id)}">${icon('folder')}<span class="${depth ? '' : 'mono'}">${esc(depth ? n.name : tilde(n.path))}</span><span class="n">${count}</span></button>
    </div>${open ? treeRows(sub, depth + 1) : ''}`
  }).join('')
  const scanned = new Date(snap.scannedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
  return `<div class="sb-top"><span class="logo">${icon('archive')}</span><b>laci</b><span class="grow"></span>
      <button class="icon-btn" data-act="palette" title="Search (Ctrl K)" aria-label="Search">${icon('search')}</button></div>
    <div class="sb-scroll">
      ${nav.map(([v, label, ic, n, isHot]) => `<button class="sb-item" data-act="view" data-v="${v}" ${st.view === v ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span>${n ? `<span class="n ${isHot ? 'hot' : ''}">${n}</span>` : ''}</button>`).join('')}
      <div class="sb-sec">Places</div>
      <div class="tree">${treeRows(snap.rootIds, 0)}</div>
    </div>
    <div class="sb-foot">
      <button class="sb-item" data-act="rescan" title="Scan again">${icon('refresh', 'sm')}<span>Scanned ${esc(scanned)}${LIVE ? '' : ' · read-only'}</span></button>
      <button class="sb-item" data-act="theme">${icon('moon', 'sm')}<span>Switch theme</span></button>
    </div>`
}

function main() {
  if (st.view === 'folder') return folderView()
  if (st.view === 'tidy') return tidyView()
  if (st.view === 'agents') return agentsView()
  return todayView()
}

/* ---------- Today ---------- */
function todayView() {
  const d = new Date(NOW).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })
  const risks = risky()
  const shown = st.expand.risks ? risks : risks.slice(0, 8)
  const recent = projects.filter(n => !n.archived).sort((a, b) => (b.lastActivity?.at ?? '').localeCompare(a.lastActivity?.at ?? '')).slice(0, 5)
  const checks = openChecks()
  const hand = handoffs()

  const riskRow = ({ n, i }) => `<div class="item" data-act="sel" data-id="${esc(n.id)}" tabindex="0" aria-selected="${st.sel === n.id}">
      ${sevGlyph(i.severity)}<span class="name">${esc(n.label)}</span><span class="t">${esc(i.title)}</span><span class="d">${esc(i.detail ?? '')}</span>
      <span class="meta">${fixBtn(n, i.code, 'act')}${n.archived ? '<span class="pill">Archived</span>' : ''}<span class="mono">${esc(ago(n.lastActivity?.at))}</span></span>
    </div>`
  const recentRow = n => {
    const s = sessionsOf(n)[0]
    const g = n.git
    const line2 = g?.lastSubject ? `${icon('commit')}<span>${esc(g.lastSubject)}</span>` : s ? '' : `<span>${esc(n.summary?.text ?? 'Files changed ' + ago(n.lastActivity?.at))}</span>`
    return `<div class="item two" data-act="sel" data-id="${esc(n.id)}" tabindex="0" aria-selected="${st.sel === n.id}">
      ${statusGlyph(n.status.value)}
      <div class="lines"><div class="l1"><span class="name">${esc(n.label)}</span>${g?.branch ? `<span class="pill">${icon('branch', 'sm')}${esc(g.branch)}</span>` : ''}</div>
        ${line2 ? `<div class="l2">${line2}</div>` : ''}${s ? `<div class="l2">${icon('bot')}<span>${esc(s.title ?? 'Untitled session')}</span><span class="faint">· ${esc(ago(s.at))}</span></div>` : ''}</div>
      <span class="meta">${s ? `<button class="btn sm act" data-act="term" data-id="${esc(n.id)}" data-what="resume" data-arg="${esc(s.id)}">${icon('terminal', 'sm')}Resume</button>` : ''}<span class="mono">${esc(ago(n.lastActivity?.at))}</span></span>
    </div>`
  }

  return `<div class="head"><h1>Today</h1><span class="count">${esc(d)}</span></div>
  <div class="body">
    ${snap.warnings.map(w => `<div class="callout">${icon('alert')}<div class="txt"><b>${esc(w.title)}</b><p>${esc(w.detail)}</p></div><button class="btn sm" data-act="backup">Back up logs now</button></div>`).join('')}
    <section class="group"><div class="group-h">Could lose work <span class="c">${risks.length}</span><span class="hint">Only on this disk, or never committed</span></div>
      ${shown.map(riskRow).join('') || '<div class="empty">Everything is committed and pushed.</div>'}
      ${risks.length > 8 ? `<div class="item"><button class="more" data-act="expand" data-k="risks">${st.expand.risks ? 'Show fewer' : `Show ${risks.length - 8} more`}</button></div>` : ''}
    </section>
    <section class="group"><div class="group-h">Pick up where you left off <span class="c">${recent.length}</span></div>${recent.map(recentRow).join('')}</section>
    <section class="group"><div class="group-h">Open to-dos <span class="c">${checks.length}</span><span class="hint">Checkboxes in your notes, plus next steps you add</span></div>
      ${checks.map(({ n, t }) => `<label class="item"><input type="checkbox" class="cb" data-check data-id="${esc(n.id)}" data-file="${esc(t.file)}" data-line="${t.line}" data-text="${esc(t.text)}">
        <span class="t" style="max-width:none;flex:1;white-space:normal">${esc(t.text)}</span>
        <span class="meta"><span class="pill">${esc(n.label)}</span><span class="mono">${esc(t.file)}:${t.line}</span></span></label>`).join('') || '<div class="empty">No open checkboxes. Add the next step from a project’s To-do tab.</div>'}
    </section>
    ${hand.length ? `<section class="group"><div class="group-h">Handoffs with open items <span class="c">${hand.length}</span></div>${hand.map(({ n, f, open }) => `<div class="item" data-act="sel" data-id="${esc(n.id)}" data-tab="todo" tabindex="0">${icon('file')}<span class="name mono" style="font-weight:400">${esc(f.file)}</span><span class="d">${esc(n.label)} · ${plural(open, 'item')} under a TODO heading</span><span class="meta"><span class="mono">${esc(ago(f.at))}</span></span></div>`).join('')}</section>` : ''}
  </div>`
}

/* ---------- Folder ---------- */
function folderView() {
  const cwd = nodes[st.cwd]
  const chain = []
  for (let n = cwd; n; n = nodes[n.parent]) chain.unshift(n)
  const crumbs = chain.map((n, i) => i === chain.length - 1 ? `<h1>${esc(i ? n.name : tilde(n.path))}</h1>` : `<button class="btn ghost sm" data-act="cd" data-id="${esc(n.id)}" style="padding:0 4px">${esc(i ? n.name : tilde(n.path))}</button><span class="faint">/</span>`).join('')
  const rows = cwd.children.map(c => nodes[c]).filter(n => st.showArchived || !n.archived)
  const val = {
    name: n => n.name.toLowerCase(),
    last: n => n.lastActivity?.at ?? '',
    size: n => n.size?.total ?? descendants(n).reduce((a, d) => a + (d.size?.total ?? 0), 0),
    ai: n => agentCount(n) + descendants(n).reduce((a, d) => a + agentCount(d), 0),
  }
  const { key, dir } = st.sort
  rows.sort((a, b) => (a.kind !== b.kind ? (a.kind === 'folder' ? -1 : 1) : (val[key](a) > val[key](b) ? 1 : val[key](a) < val[key](b) ? -1 : 0) * dir))
  const col = (k, label, cls) => `<span class="${cls}"><button data-act="sort" data-k="${k}" ${key === k ? `aria-sort="${dir > 0 ? 'ascending' : 'descending'}"` : ''}>${label}${key === k ? (dir > 0 ? ' ↑' : ' ↓') : ''}</button></span>`
  const inside = descendants(cwd).filter(d => d.kind === 'project')

  return `<div class="head">${crumbs}<span class="count">${plural(inside.length, 'project')}</span><span class="grow"></span>
      <label class="switch"><input type="checkbox" data-archived ${st.showArchived ? 'checked' : ''}>Show archived</label>
      <button class="icon-btn" data-act="open" data-id="${esc(cwd.id)}" data-what="files" title="Open in Dolphin" aria-label="Open in file manager">${icon('open')}</button>
      <button class="icon-btn" data-act="term" data-id="${esc(cwd.id)}" data-what="shell" title="Terminal here (F4)" aria-label="Open terminal here">${icon('terminal')}</button></div>
    <div class="body">
      <div class="cols">${col('name', 'Name', 'c-name')}<span class="c-sum">Summary</span><span class="c-stack">Stack</span>${col('ai', 'Agents', 'c-ai')}${col('last', 'Activity', 'c-when')}${col('size', 'Size', 'c-size')}<span class="c-health"></span></div>
      ${rows.map(n => {
        const kids = descendants(n).filter(d => d.kind === 'project')
        const issues = n.kind === 'project' ? n.issues : kids.flatMap(k => k.issues)
        const worst = issues.some(i => i.severity === 'high') ? 'high' : issues.some(i => i.severity === 'med') ? 'med' : null
        const ai = val.ai(n)
        return `<div class="item frow ${n.archived ? 'archived' : ''}" data-act="pick" data-id="${esc(n.id)}" tabindex="0" aria-selected="${st.sel === n.id}">
          <span class="c-name">${n.kind === 'project' ? statusGlyph(n.status.value) : ''}${kindIcon(n)}<span class="nm">${esc(n.name)}</span></span>
          <span class="c-sum">${n.kind === 'folder' ? esc(n.summary?.text ?? `${plural(kids.length, 'project')} inside`) : esc(n.summary?.text ?? '')}</span>
          <span class="c-stack">${(n.stack?.labels ?? []).slice(0, 2).map(l => `<span class="tag">${esc(l)}</span>`).join('')}</span>
          <span class="c-ai">${ai ? `${icon('bot', 'sm')}${ai}` : ''}</span>
          <span class="c-when">${esc(ago(n.lastActivity?.at))}</span>
          <span class="c-size">${esc(bytes(val.size(n)))}</span>
          <span class="c-health" title="${esc(issues.filter(i => i.severity !== 'low').map(i => i.title).join('\n'))}">${worst ? sevGlyph(worst) : ''}</span>
        </div>`
      }).join('') || '<div class="empty">Nothing here.</div>'}
    </div>`
}

/* ---------- Tidy ---------- */
const CATS = { reconnect: ['Reconnect', 'link'], migration: ['Half-done moves', 'route'], space: ['Free space', 'drive'], duplicate: ['Duplicates', 'layers'], orphan: ['Orphaned', 'unlink'], status: ['Archive', 'archive'] }
function tidyView() {
  const list = snap.proposals.filter(p => st.tidy === 'all' || p.category === st.tidy)
  const counts = snap.proposals.reduce((a, p) => ((a[p.category] = (a[p.category] ?? 0) + 1), a), {})
  const recent = st.journal.slice(0, 6)
  return `<div class="head"><h1>Tidy up</h1><span class="count">${plural(snap.proposals.length, 'suggestion')}</span><span class="grow"></span><span class="muted" style="font-size:12px">Every change is listed before anything moves, and can be undone</span></div>
    <div class="filterbar"><button class="chipf" data-act="tidyf" data-k="all" aria-pressed="${st.tidy === 'all'}">All <span class="n">${snap.proposals.length}</span></button>
      ${Object.entries(CATS).filter(([k]) => counts[k]).map(([k, [label, ic]]) => `<button class="chipf" data-act="tidyf" data-k="${k}" aria-pressed="${st.tidy === k}">${icon(ic, 'sm')}${label} <span class="n">${counts[k]}</span></button>`).join('')}</div>
    <div class="body">
      ${recent.length ? `<section class="group"><div class="group-h">Recent changes <span class="c">${recent.length}</span></div>${recent.map(j => `<div class="item">${icon('history')}<span class="name" style="max-width:none;flex:1;font-weight:400">${esc(j.title)}</span>
        <span class="meta">${j.state === 'applied' ? '<span class="pill ok">Applied</span>' : j.state === 'undone' ? '<span class="pill">Undone</span>' : `<span class="pill bad" title="${esc(j.error ?? '')}">${esc(cap(j.state))}</span>`}<span class="mono">${esc(ago(j.at))}</span>
        ${j.state === 'applied' ? `<button class="btn sm" data-act="undo" data-id="${esc(j.id)}">${icon('undo', 'sm')}Undo</button>` : ''}</span></div>`).join('')}</section>` : ''}
      <section class="group"><div class="group-h">Suggestions</div>
      ${list.map(p => {
        const open = !!st.open[p.id]
        const [, ic] = CATS[p.category] ?? [p.category, 'sparkles']
        return `<div class="prop-row" data-open="${open}">
          <div class="item" data-act="toggle" data-id="${esc(p.id)}" tabindex="0" aria-expanded="${open}">
            ${icon('chev', 'sm chev')}${icon(ic)}<span class="name" style="max-width:none;flex:1;white-space:normal">${esc(p.title)}</span>
            <span class="meta"><span class="conf ${p.confidence}">${cap(p.confidence)} confidence</span><span>${plural(p.ops.length, 'change')}</span></span>
          </div>
          ${open ? `<div class="prop-body"><p>${esc(p.why)}</p>${opsList(p.ops)}
            <div class="row-acts">${p.action
              ? `<button class="btn sm primary" data-act="apply" data-id="${esc(p.id)}">Apply ${plural(p.ops.length, 'change')}</button>`
              : '<span class="muted" style="font-size:12px">Nothing to apply automatically. Open both and decide which one to keep.</span>'}
              ${p.nodeId && nodes[p.nodeId] ? `<span class="grow"></span><button class="btn sm ghost" data-act="sel" data-id="${esc(p.nodeId)}">Open ${esc(nodes[p.nodeId].label)}</button>` : ''}</div></div>` : ''}
        </div>`
      }).join('') || '<div class="empty">Nothing to tidy here.</div>'}</section>
    </div>`
}

function opsList(ops, optional = false) {
  return `<ul class="ops">${ops.map((o, i) => `<li class="k-${esc(o.kind)}">${icon(o.kind)}<div class="lab">${optional && o.kind === 'delete' ? `<label><input type="checkbox" class="cb" id="opt-heavy">${esc(o.label)}</label>` : esc(o.label)}</div>
    ${o.from || o.to ? `<div class="ft">${o.from ? esc(o.from) : ''}${o.from && o.to ? '<span class="arr">→</span>' : ''}${o.to ? esc(o.to) : ''}</div>` : ''}
    ${o.detail ? `<div class="det">${esc(o.detail)}</div>` : ''}</li>`).join('')}</ul>`
}

/* ---------- Agents ---------- */
const KIND = {
  cwd: ['Log files that record the folder', 'Each log names the folder it ran in, like Codex.'],
  named: ['One folder per project', 'The tool keeps a folder named after each project, like Claude Code.'],
  inside: ['Inside the project', 'History sits in the project folder itself, like Aider.'],
  mentions: ['Files that mention the project', 'Notes or plans that mention a project path, like Claude plans.'],
}
function agentsView() {
  const bytesOf = n => n.agents.claude.reduce((a, k) => a + snap.claude[k].bytes, 0) + n.agents.items.filter(counted).reduce((a, i) => a + snap.items[i].bytes, 0)
  const linked = all.filter(n => n.agents.claude.length || n.agents.items.some(counted))
    .map(n => ({ n, sessions: agentCount(n), mem: n.agents.claude.reduce((a, k) => a + snap.claude[k].memory.length, 0), bytes: bytesOf(n) }))
    .sort((a, b) => b.bytes - a.bytes)
  const max = Math.max(...linked.map(l => l.bytes), 1)
  const globalDirs = snap.global.claude.map(k => snap.claude[k])
  const byWhere = new Map()
  for (const it of snap.orphans.items.map(i => snap.items[i])) {
    const key = `${it.connector}\0${it.cwd ?? it.file}`
    byWhere.set(key, [...(byWhere.get(key) ?? []), it])
  }
  const orphanRows = [
    ...snap.orphans.claude.map(k => ({ name: k, what: `${plural(snap.claude[k].sessions.length, 'session')} · ${plural(snap.claude[k].memory.length, 'memory file')}`, at: snap.claude[k].sessions[0]?.at, tool: 'Claude Code' })),
    ...[...byWhere.values()].map(list => ({ name: tilde(list[0].cwd ?? list[0].file), what: plural(list.length, conn(list[0].connector)?.link.kind === 'cwd' ? 'session' : 'folder'), at: list[0].at, tool: conn(list[0].connector)?.name ?? list[0].connector })),
  ]
  const unmatched = snap.unmatched.map(i => snap.items[i])
  const card = c => `<div class="stat">
      <div class="top"><span class="k">${esc(c.name)}</span>${c.builtin ? '' : '<span class="tag">Custom</span>'}</div>
      ${c.present ? `<div class="v">${esc(bytes(c.bytes))}</div>` : '<div class="v none">Nothing here yet</div>'}
      <p>${esc(c.about)}${c.present && c.id !== 'claude' ? ` · ${plural(c.count, c.link.kind === 'cwd' ? 'log' : c.link.kind === 'named' ? 'folder' : 'file')}` : ''}</p>
      <div class="p">${esc(c.where)}</div>
      <div class="mv">On move: ${esc(c.moves.charAt(0).toLowerCase() + c.moves.slice(1))}</div>
      <div class="foot"><span class="grow"></span><button class="btn sm ghost" data-act="connrm" data-id="${esc(c.id)}">Remove</button></div>
    </div>`
  const found = snap.suggestions.filter(x => x.found)
  const nudge = found.map(x => `<div class="callout">${icon('sparkles')}<div class="txt"><b>${esc(x.name)} history found on this PC</b><p>${esc(x.about)}${x.detail ? ` · ${esc(x.detail)}` : ''}. Add it so it shows on projects and moves with them.</p></div><button class="btn sm" data-act="connpreset" data-id="${esc(x.id)}">Add ${esc(x.name)}</button></div>`).join('')
  const top = snap.connectors.length
    ? `${nudge}<div class="stats">${snap.connectors.map(card).join('')}<button class="stat add" data-act="connadd">${icon('plus')}<span>Add a connector</span><small class="faint">Another AI tool you use</small></button></div>`
    : `<div class="empty-hero"><h2>Connect the AI tools you use</h2><p>laci reads where each tool keeps its sessions, shows them on the right project, and carries them along when you move or archive one.</p><button class="btn primary" data-act="connadd">${icon('plus', 'sm')}Add a connector</button></div>${nudge}`
  return `<div class="head"><h1>Agent history</h1><span class="count">${snap.connectors.length ? plural(snap.connectors.length, 'connector') : 'No connectors yet'}</span><span class="grow"></span>${snap.connectors.length ? '<button class="btn sm" data-act="backup">Back up logs now</button>' : ''}</div>
    <div class="body">
      ${top}
      ${!snap.connectors.length ? '' : `<section class="group"><div class="group-h">Detached <span class="c">${orphanRows.length}</span><span class="hint">The folder moved or was deleted</span><span class="right"><button class="btn sm" data-act="view" data-v="tidy">Fix in Tidy up</button></span></div>
        ${orphanRows.map(o => `<div class="item">${icon('unlink')}<span class="name mono" style="font-weight:400;max-width:48%">${esc(o.name)}</span><span class="d">${esc(o.what)}</span><span class="meta"><span class="pill">${esc(o.tool)}</span><span class="mono">${esc(date(o.at))}</span></span></div>`).join('') || '<div class="empty">Every session belongs to a folder that exists.</div>'}</section>
      <section class="group"><div class="group-h">By project <span class="c">${linked.length}</span></div>
        ${linked.map(({ n, sessions, mem, bytes: b }) => `<div class="item" data-act="sel" data-id="${esc(n.id)}" data-tab="agents" tabindex="0" aria-selected="${st.sel === n.id}">${kindIcon(n)}<span class="name">${esc(n.label)}</span><span class="d">${plural(sessions, 'session')}${mem ? ` · ${plural(mem, 'memory file')}` : ''}</span><span class="meta"><span class="meter"><i style="width:${Math.max(2, (b / max) * 100)}%"></i></span><span class="mono" style="width:56px;text-align:right">${esc(bytes(b))}</span></span></div>`).join('') || '<div class="empty">No project has agent history yet.</div>'}</section>`}
      ${globalDirs.length ? `<section class="group"><div class="group-h">Outside project folders <span class="c">${globalDirs.length}</span></div>${globalDirs.map(c => `<div class="item">${icon('folder')}<span class="name mono" style="font-weight:400">${esc(tilde(c.path))}</span><span class="d">${plural(c.sessions.length, 'session')} · ${plural(c.memory.length, 'memory file')}</span><span class="meta"><span class="mono">${esc(bytes(c.bytes))}</span></span></div>`).join('')}</section>` : ''}
      ${unmatched.length ? `<section class="group"><div class="group-h">Not matched <span class="c">${unmatched.length}</span><span class="hint">Named by a hash of a folder laci didn't scan</span></div>${unmatched.map(it => `<div class="item">${icon('history')}<span class="name mono" style="font-weight:400">${esc(it.file.split('/').pop().slice(0, 12))}…</span><span class="d">${esc(conn(it.connector)?.name ?? '')}</span><span class="meta"><span class="mono">${esc(bytes(it.bytes))}</span><span class="mono">${esc(date(it.at))}</span></span></div>`).join('')}</section>` : ''}
    </div>`
}

/** Step one: pick a tool laci already knows, or describe another one. */
function pickDialog() {
  const list = [...snap.suggestions].sort((a, b) => Number(b.found) - Number(a.found))
  return `<div class="scrim" data-act="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="c-t">
    <div class="dh"><h2 id="c-t">Add a connector</h2>
      <p class="desc">Pick the AI tool. laci shows its history on each project and carries it along when you move or archive one.</p></div>
    <div class="db">
      ${list.map(x => `<button class="pick" data-act="connpreset" data-id="${esc(x.id)}">${icon('bot')}<div class="txt"><b>${esc(x.name)}</b><p>${esc(x.about)} · <span class="mono">${esc(x.where)}</span></p></div>${x.found ? `<span class="found">Found${x.detail ? ` · ${esc(x.detail)}` : ''}</span>` : '<span class="faint" style="font-size:12px">Not on this PC</span>'}</button>`).join('')}
      <button class="pick" data-act="conncustom">${icon('plus')}<div class="txt"><b>Another tool…</b><p>Tell laci where it keeps its history</p></div>${icon('chev', 'sm')}</button>
    </div>
    <div class="df"><p>Saved in ~/.config/laci/config.json</p><button class="btn" data-act="closemodal">Cancel</button></div>
  </div></div>`
}

function connectorDialog() {
  if (st.modal.step !== 'custom') return pickDialog()
  const d = st.modal.draft ?? {}
  const v = k => esc(d[k] ?? '')
  const kind = d.kind ?? 'cwd'
  return `<div class="scrim" data-act="scrim"><form class="dialog cform" data-form="connector" role="dialog" aria-modal="true" aria-labelledby="c-t">
    <div class="dh"><h2 id="c-t">Another tool</h2>
      <p class="desc">Tell laci where it keeps its history. It will show up on each project, and move along when you move or archive one.</p></div>
    <div class="db">
      <label class="fld"><span>Name</span><input class="inp" name="name" value="${v('name')}" placeholder="OpenCode, Cursor, my own agent…" autocomplete="off" required maxlength="40"></label>
      <div class="fld"><span>Where does it keep its history?</span><div class="choices">
        ${Object.entries(KIND).map(([k, [t, p]]) => `<label class="choice"><input type="radio" name="kind" value="${k}" ${kind === k ? 'checked' : ''}><div><b>${t}</b><p>${p}</p></div></label>`).join('')}
      </div></div>
      <div class="kf cwd">
        <label class="fld"><span>Folder with the logs</span><input class="inp mono" name="cwd_dir" value="${v('cwd_dir')}" placeholder="~/.tool/sessions"><small>Searched with every subfolder.</small></label>
        <div class="row2"><label class="fld"><span>File type</span><input class="inp mono" name="cwd_ext" value="${esc(d.cwd_ext ?? '.jsonl')}"></label>
          <label class="fld"><span>Field that holds the folder</span><input class="inp mono" name="cwd_field" value="${esc(d.cwd_field ?? 'cwd')}"></label></div>
      </div>
      <div class="kf named">
        <label class="fld"><span>Folder that holds one folder per project</span><input class="inp mono" name="named_dir" value="${v('named_dir')}" placeholder="~/.tool/projects"></label>
        <label class="fld"><span>How the folders are named</span><select class="inp" name="named_naming">
          <option value="dashes" ${d.named_naming !== 'sha256' ? 'selected' : ''}>Path with dashes: -home-me-project-app</option>
          <option value="sha256" ${d.named_naming === 'sha256' ? 'selected' : ''}>SHA-256 hash of the path</option></select></label>
      </div>
      <div class="kf inside"><label class="fld"><span>Path inside each project</span><input class="inp mono" name="inside_path" value="${v('inside_path')}" placeholder=".tool/history"><small>A file or a folder. It already moves with the project; laci shows it on the project.</small></label></div>
      <div class="kf mentions">
        <div class="row2"><label class="fld"><span>Folder</span><input class="inp mono" name="mentions_dir" value="${v('mentions_dir')}" placeholder="~/.tool/plans"></label>
          <label class="fld"><span>File type</span><input class="inp mono" name="mentions_ext" value="${esc(d.mentions_ext ?? '.md')}"></label></div>
      </div>
    </div>
    <div class="df">${st.modal.error ? `<p class="err" role="alert">${esc(st.modal.error)}</p>` : '<p>Saved in ~/.config/laci/config.json</p>'}
      <button type="button" class="btn" data-act="connadd">Back</button><button class="btn primary">Add connector</button></div>
  </form></div>`
}

/* ---------- Inspector ---------- */
function insp() {
  const n = nodes[st.sel]
  const m = n.meta
  const s = n.status
  const isProject = n.kind === 'project'
  const tasks = n.tasks.filter(t => !t.done).length
  const sess = sessionsOf(n)
  const tabs = [['health', 'Health'], ['todo', 'To-do', tasks], ['agents', 'Agents', agentCount(n)], ...(n.readme ? [['readme', 'README']] : [])]
  if (!tabs.some(t => t[0] === st.tab)) st.tab = 'health'
  const parent = nodes[n.parent]
  const g = n.git
  const remote = g?.remotes[0]
  const kids = descendants(n).filter(d => d.kind === 'project')
  const statuses = ['active', 'idle', 'dormant', 'idea', 'paused', 'done', 'archived']
  const primary = sess[0]
    ? `<button class="btn primary sm" data-act="term" data-id="${esc(n.id)}" data-what="resume" data-arg="${esc(sess[0].id)}">${icon('terminal', 'sm')}Resume last session</button>`
    : `<button class="btn primary sm" data-act="term" data-id="${esc(n.id)}" data-what="shell">${icon('terminal', 'sm')}Terminal</button>`

  return `<div class="head"><div class="ih-crumb">${parent ? `<span>${esc(parent.name)}</span>${icon('chev', 'sm')}` : ''}<b>${esc(n.name)}</b></div><span class="grow"></span>
      <button class="icon-btn" data-act="copy" data-text="${esc(n.path)}" title="Copy path" aria-label="Copy path">${icon('copy')}</button>
      <button class="icon-btn" data-act="close" title="Close (Esc)" aria-label="Close details">${icon('x')}</button></div>
    <div class="ibody">
      <div class="ititle">
        <h2>${kindIcon(n)}${esc(n.name)}</h2>
        <div class="path mono">${esc(tilde(n.path))}</div>
        ${n.summary ? `<p class="sum">${esc(n.summary.text)} <span class="src">— ${esc(n.summary.source)}</span></p>` : isProject ? `<p class="sum muted">No summary yet. <button class="linkbtn" data-act="term" data-id="${esc(n.id)}" data-what="summary">Ask Claude to write one</button></p>` : ''}
        ${n.readme?.title && !n.readme.weakTitle && n.readme.title.toLowerCase() !== n.name.toLowerCase() ? `<p class="aka">README title: ${esc(n.readme.title)}</p>` : ''}
      </div>
      <dl class="props">
        <dt>Status</dt><dd><label class="pbtn">${statusGlyph(s.value)}<span>${cap(s.value)}</span>${s.auto ? '<span class="sub">auto</span>' : ''}<select data-meta="status" aria-label="Status"><option value="">Automatic</option>${statuses.map(v => `<option value="${v}" ${!s.auto && s.value === v ? 'selected' : ''}>${cap(v)}</option>`).join('')}</select></label></dd>
        <dt>Priority</dt><dd><label class="pbtn ${m.priority ? '' : 'placeholder'}">${prioGlyph(m.priority)}<span>${m.priority ? cap(m.priority) : 'No priority'}</span><select data-meta="priority" aria-label="Priority">${['', 'high', 'medium', 'low'].map(v => `<option value="${v}" ${(m.priority ?? '') === v ? 'selected' : ''}>${v ? cap(v) : 'No priority'}</option>`).join('')}</select></label></dd>
        <dt>Deadline</dt><dd><label class="pbtn ${m.deadline ? '' : 'placeholder'}">${icon('calendar', 'sm')}<span>${m.deadline ? esc(date(m.deadline)) : 'Set deadline'}</span><input type="date" data-act="pick-date" data-meta="deadline" value="${esc(m.deadline ?? '')}" aria-label="Deadline"></label>${m.deadline ? `<button class="icon-btn" style="width:22px;height:22px" data-act="clear-deadline" data-id="${esc(n.id)}" aria-label="Clear deadline">${icon('x', 'sm')}</button>` : ''}</dd>
        ${g ? `<dt>Remote</dt><dd><span class="pval">${remote ? `${icon('link', 'sm')}${remote.web ? `<a href="${esc(remote.web)}" target="_blank" rel="noreferrer"><span>${esc(remote.web.replace(/^https:\/\//, ''))}</span></a>` : `<span class="mono">${esc(remote.url)}</span>`}` : `<span style="color:var(--red)">None · only on this disk</span>`}</span></dd>
          <dt>Branch</dt><dd><span class="pval">${icon('branch', 'sm')}<span class="mono">${esc(g.branch ?? '—')}</span>${g.dirty ? `<span class="faint">· ${g.dirty} changed</span>` : ''}</span></dd>` : ''}
        ${n.stack?.labels.length ? `<dt>Stack</dt><dd style="padding:4px 0 4px 8px;gap:4px">${n.stack.labels.slice(0, 6).map(l => `<span class="tag">${esc(l)}</span>`).join('')}</dd>` : ''}
        ${n.kind === 'folder' ? `<dt>Inside</dt><dd><span class="pval">${plural(kids.length, 'project')} · ${kids.filter(k => k.archived).length} archived</span></dd>` : ''}
        <dt>Activity</dt><dd><span class="pval"><span>${esc(ago(n.lastActivity?.at))}${n.lastActivity?.source ? ` <span class="faint">· ${esc(n.lastActivity.source)}</span>` : ''}</span></span></dd>
        ${n.size ? `<dt>Size</dt><dd><span class="pval"><span>${esc(bytes(n.size.total))}${n.size.reclaimable ? ` <span class="faint">· ${esc(bytes(n.size.reclaimable))} reclaimable</span>` : ''}</span></span></dd>` : ''}
      </dl>
      <div class="tabs" role="tablist">${tabs.map(([k, label, c]) => `<button role="tab" data-act="tab" data-k="${k}" aria-selected="${st.tab === k}">${label}${c ? `<span class="n">${c}</span>` : ''}</button>`).join('')}</div>
      <div class="tabbody">${st.tab === 'todo' ? todoTab(n) : st.tab === 'agents' ? agentsTab(n) : st.tab === 'readme' ? readmeTab(n) : healthTab(n)}</div>
    </div>
    <div class="ifoot">${primary}
      <button class="btn sm" data-act="open" data-id="${esc(n.id)}" data-what="editor">${icon('editor', 'sm')}Editor</button>
      <button class="btn sm" data-act="open" data-id="${esc(n.id)}" data-what="files">${icon('open', 'sm')}Dolphin</button>
      <span class="spacer"></span>
      ${isProject && !n.archived && n.archivePlan ? `<button class="btn ghost sm" data-act="archive" data-id="${esc(n.id)}">${icon('archive', 'sm')}Archive…</button>` : ''}
    </div>`
}

function healthTab(n) {
  const out = []
  const issues = n.kind === 'project' ? n.issues : descendants(n).filter(d => d.kind === 'project').flatMap(d => d.issues.filter(i => i.severity === 'high').map(i => ({ ...i, title: `${d.label}: ${i.title}` })))
  out.push(`<div class="sec-t">Checks</div>${issues.length ? issues.map(i => `<div class="issue">${sevGlyph(i.severity)}<div class="txt"><p>${esc(i.title)}</p>${i.detail ? `<p class="d">${esc(i.detail)}</p>` : ''}</div>${n.kind === 'project' ? fixBtn(n, i.code) : ''}</div>`).join('') : `<div class="issue">${statusGlyph('done')}<div class="txt"><p>All clear</p><p class="d">Committed, pushed, nothing forgotten.</p></div></div>`}`)

  const g = n.git
  if (g) {
    const mx = Math.max(...g.weekly, 1)
    out.push(`<div class="sec-t">Commits <span class="grow"></span><span class="faint" style="font-weight:400">${g.commits} total${g.authors > 1 ? ` · ${g.authors} authors` : ''}</span></div>
      <div class="spark" aria-label="Commits per week, last 26 weeks">${g.weekly.map(w => `<i class="${w ? '' : 'z'}" style="height:${w ? Math.max(10, (w / mx) * 100) : 6}%" title="${w} commits"></i>`).join('')}</div>
      <div class="spark-cap"><span>${esc(date(new Date(NOW - 182 * 864e5).toISOString()))}</span><span>this week</span></div>
      <dl class="kv" style="margin-top:12px">
        <dt>First commit</dt><dd>${esc(date(g.firstCommitAt))}</dd>
        <dt>Last commit</dt><dd>${g.lastSubject ? `${esc(g.lastSubject)} <span class="faint">· ${esc(ago(g.lastCommitAt))}</span>` : 'None yet'}</dd>
        ${g.upstream ? `<dt>Tracking</dt><dd class="mono">${esc(g.upstream)}${g.ahead || g.behind ? ` <span class="faint">· ${g.ahead} ahead, ${g.behind} behind</span>` : ''}</dd>` : ''}
        ${g.stashes ? `<dt>Stashes</dt><dd>${g.stashes}</dd>` : ''}
      </dl>`)
  } else if (n.kind === 'project') {
    out.push(`<div class="sec-t">History</div><dl class="kv"><dt>Folder made</dt><dd>${esc(date(n.createdAt?.at))}</dd><dt>Last change</dt><dd>${esc(ago(n.lastActivity?.at))}</dd><dt>Git</dt><dd>Not tracked</dd></dl>`)
  }

  const sk = n.stack
  if (sk?.scripts.length) {
    const pm = sk.packageManager ?? 'npm'
    const runner = name => (pm === 'npm' ? `npm run ${name}` : `${pm} ${name}`)
    out.push(`<div class="sec-t">Run in a terminal</div><div class="cmds">${sk.scripts.map(s => `<button class="btn sm" data-act="term" data-id="${esc(n.id)}" data-what="script" data-arg="${esc(s.name)}" title="${esc(s.cmd)}">${icon('play', 'sm')}${esc(runner(s.name))}</button>`).join('')}</div>`)
  }
  if (sk && (sk.services.length || sk.env.length || sk.deploy.length || sk.ci.length || sk.languages.length)) {
    out.push(`<div class="sec-t">Setup</div><dl class="kv">
      ${sk.languages.length ? `<dt>Languages</dt><dd>${sk.languages.slice(0, 3).map(l => `${esc(l.name)} <span class="faint">${l.files}</span>`).join(', ')}</dd>` : ''}
      ${sk.services.length ? `<dt>Services</dt><dd>${sk.services.map(esc).join(', ')}</dd>` : ''}
      ${sk.env.length ? `<dt>Env vars</dt><dd>${sk.env.length} in .env.example</dd>` : ''}
      ${sk.deploy.length ? `<dt>Deploy</dt><dd>${sk.deploy.map(esc).join(', ')}</dd>` : ''}
      ${sk.ci.length ? `<dt>CI</dt><dd>${sk.ci.map(esc).join(', ')}</dd>` : ''}</dl>`)
  }
  if (n.readme?.links.length) out.push(`<div class="sec-t">Links</div>${n.readme.links.map(l => `<div class="sess">${icon('link', 'sm')}<a class="t" href="${esc(l.url)}" target="_blank" rel="noreferrer">${esc(l.label)}</a><span class="m">${esc(new URL(l.url).hostname)}</span></div>`).join('')}`)
  return out.join('')
}

function todoTab(n) {
  const mine = n.tasks.filter(t => t.file === '.laci.md' && t.kind === 'check')
  const checks = n.tasks.filter(t => t.file !== '.laci.md' && t.kind === 'check')
  const lists = n.tasks.filter(t => t.kind === 'list')
  const byFile = arr => Object.entries(arr.reduce((a, t) => ((a[t.file] ??= []).push(t), a), {}))
  const limit = st.expand['list:' + n.id] ? Infinity : 8
  const box = t => `<label class="todo ${t.done ? 'done' : ''}"><input type="checkbox" class="cb" data-check data-id="${esc(n.id)}" data-file="${esc(t.file)}" data-line="${t.line}" data-text="${esc(t.text)}" ${t.done ? 'checked' : ''}><div class="txt">${esc(t.text)}${t.section && t.file !== '.laci.md' ? `<div class="src">${esc(t.section)}</div>` : ''}</div>${t.file === '.laci.md' ? `<button class="icon-btn" data-act="deltodo" data-id="${esc(n.id)}" data-line="${t.line}" data-text="${esc(t.text)}" aria-label="Delete">${icon('x', 'sm')}</button>` : ''}</label>`
  return `
    <div class="sec-t">Next steps <span class="grow"></span><span class="faint mono" style="font-weight:400">.laci.md</span></div>
    ${mine.map(box).join('')}
    <form class="add" data-form="todo" data-id="${esc(n.id)}">${icon('plus', 'sm')}<input name="t" placeholder="Add the next step…" autocomplete="off" aria-label="New to-do"></form>
    ${byFile(checks).map(([file, ts]) => `<div class="sec-t">Checkboxes <span class="grow"></span><span class="faint mono" style="font-weight:400">${esc(file)}</span></div>${ts.map(box).join('')}`).join('')}
    ${byFile(lists).map(([file, ts]) => `<div class="sec-t">Listed under TODO <span class="grow"></span><span class="faint mono" style="font-weight:400">${esc(file)} · ${esc(ago(n.taskFiles.find(f => f.file === file)?.at))}</span></div>
      ${ts.slice(0, limit).map(t => `<div class="todo ${t.done ? 'done' : ''}"><span class="bullet">–</span><div class="txt">${esc(t.text)}${t.section ? `<div class="src">${esc(t.section)}</div>` : ''}</div></div>`).join('')}
      ${ts.length > 8 ? `<button class="more" data-act="expand" data-k="list:${esc(n.id)}">${st.expand['list:' + n.id] ? 'Show fewer' : `Show all ${ts.length}`}</button>` : ''}`).join('')}
    <div class="sec-t">Notes <span class="grow"></span><span class="faint" id="notes-state" style="font-weight:400"></span></div>
    <textarea class="notes" data-notes data-id="${esc(n.id)}" placeholder="Context for future you, or for the next agent session…">${esc(n.notes ?? '')}</textarea>`
}

function agentsTab(n) {
  const out = []
  const sess = sessionsOf(n)
  const limit = st.expand['sess:' + n.id] ? Infinity : 8
  if (sess.length) out.push(`<div class="sec-t">Claude Code <span class="grow"></span><span class="faint" style="font-weight:400">${plural(sess.length, 'session')}</span></div>${sess.slice(0, limit).map(s => `<div class="sess">${icon('bot', 'sm')}<span class="t">${esc(s.title ?? 'Untitled session')}</span><span class="m">${esc(date(s.at))}</span><button class="btn sm act" data-act="term" data-id="${esc(n.id)}" data-what="resume" data-arg="${esc(s.id)}">Resume</button></div>`).join('')}
    ${sess.length > 8 ? `<button class="more" data-act="expand" data-k="sess:${esc(n.id)}">${st.expand['sess:' + n.id] ? 'Show fewer' : `Show all ${sess.length}`}</button>` : ''}`)
  const mem = n.agents.claude.flatMap(k => snap.claude[k].memory)
  if (mem.length) out.push(`<div class="sec-t">Memory <span class="grow"></span><span class="faint" style="font-weight:400">${plural(mem.length, 'file')}</span></div><div style="display:flex;flex-wrap:wrap;gap:4px">${mem.map(f => `<span class="tag mono">${esc(f)}</span>`).join('')}</div>`)
  const groups = {}
  for (const it of n.agents.items.map(i => snap.items[i]).sort((a, b) => b.at.localeCompare(a.at))) (groups[it.connector] ??= []).push(it)
  for (const [id, list] of Object.entries(groups)) {
    const c = conn(id)
    const k = c?.link.kind
    const lim = st.expand[`it:${id}:${n.id}`] ? Infinity : 6
    const title = k === 'mentions' ? `${esc(c.name)} that mention this folder` : esc(c?.name ?? id)
    out.push(`<div class="sec-t">${title}<span class="grow"></span><span class="faint" style="font-weight:400">${k === 'inside' ? 'in the folder' : plural(list.length, k === 'cwd' ? 'session' : k === 'named' ? 'folder' : 'file')}</span></div>

      ${list.length > 6 ? `<button class="more" data-act="expand" data-k="it:${esc(id)}:${esc(n.id)}">${st.expand[`it:${id}:${n.id}`] ? 'Show fewer' : `Show all ${list.length}`}</button>` : ''}`)
  }
  const dirs = n.agents.claude.map(k => snap.claude[k])
  const stores = Object.keys(groups).map(conn).filter(c => c && c.link.kind !== 'inside')
  out.push(`<div class="sec-t">Stored at</div><dl class="kv">
    ${dirs.map(c => `<dt>Claude Code</dt><dd class="mono" style="font-size:11px">~/.claude/projects/${esc(c.name)}<br><span class="faint">${esc(bytes(c.bytes))}${c.subagentLogs ? ` · ${c.subagentLogs} subagent logs` : ''}</span></dd>`).join('')}

  if (!sess.length && !n.agents.items.length) out.unshift('<p class="muted" style="margin-top:14px">No agent has worked in this folder, as far as the logs show.</p>')
  return out.join('')

    .filter(([, l]) => match(l.toLowerCase())).map(([id, label, ic]) => ({ id, sec: 'Actions', label, sub: '', icon: icon(ic), acc: '' }))

/** Run a change against the server. In the read-only preview (opened as a file) nothing can change. */

    return await fn()

  } finally {

const xtheme = () => XTHEMES[getComputedStyle(document.documentElement).colorScheme === 'dark' ? 'dark' : 'light']
function applyTermTheme() { for (const t of T.tabs) t.xt.options.theme = xtheme() }

const T = { tabs: [], active: null, shown: false, max: false }
const queues = {}

function renderTermBar() {
  const box = $('#term')
  if (!box) return
  box.hidden = !T.shown
  box.classList.toggle('max', T.max)
  $('.term-bar', box).innerHTML = T.tabs.map(t => `<button class="ttab ${t.exited !== undefined ? 'ended' : ''}" data-act="tsel" data-id="${esc(t.id)}" aria-selected="${t.id === T.active}" title="${esc(tilde(t.cwd))}">${icon('terminal', 'sm')}${esc(t.title)}<span class="x" data-act="tclose" data-id="${esc(t.id)}" aria-label="Close terminal">${icon('x', 'sm')}</span></button>`).join('')
    + `<button class="icon-btn" data-act="tnew" title="New terminal here" aria-label="New terminal">${icon('plus', 'sm')}</button><span class="grow"></span>`
    + `<button class="icon-btn" data-act="text" title="Open in kitty" aria-label="Open this folder in an external terminal">${icon('open', 'sm')}</button>`
    + `<button class="icon-btn" data-act="tmax" title="${T.max ? 'Restore' : 'Maximize'}" aria-label="Maximize terminal">${icon(T.max ? 'x' : 'layers', 'sm')}</button>`
    + `<button class="icon-btn" data-act="thide" title="Hide (F4)" aria-label="Hide terminal">${icon('chev', 'sm')}</button>`
  for (const t of T.tabs) t.host.hidden = t.id !== T.active
}

function fitActive() {
  const t = T.tabs.find(x => x.id === T.active)
  if (!t || !T.shown) return
  try { t.fit.fit() } catch {}
}

function addTab(info) {
  const host = document.createElement('div')
  host.className = 'xhost'
  $('#term .term-body').append(host)
  const xt = new Terminal({ fontFamily: '"Geist Mono", "JetBrainsMono Nerd Font", "Symbols Nerd Font", monospace', fontSize: 13, lineHeight: 1.2, cursorBlink: true, scrollback: 5000, theme: xtheme() })
  const fit = new FitAddon.FitAddon()
  xt.loadAddon(fit)
  xt.open(host)
  const tab = { ...info, xt, fit, host }
  xt.onData(d => typeInto(tab.id, d))
  xt.onResize(({ cols, rows }) => api('term/resize', { id: tab.id, cols, rows }).catch(() => {}))
  tab.es = new EventSource(`/api/term/stream?id=${encodeURIComponent(tab.id)}&token=${encodeURIComponent(window.LACI.token)}`)
  tab.es.onmessage = e => {
    const ev = JSON.parse(e.data)
    if (ev.type === 'data') xt.write(ev.data)
    else {
      tab.exited = ev.code
      xt.write(`\r\n\x1b[2m[exited with ${ev.code}. Close the tab or press + for a new one]\x1b[0m\r\n`)
      tab.es.close()
      renderTermBar()
    }
  }
  T.tabs.push(tab)
  return tab
}

/** Keystrokes are sent in order, batched while a request is in flight. */
function typeInto(id, data) {
  const q = (queues[id] ??= { buf: '', busy: false })
  q.buf += data
  if (q.busy) return
  q.busy = true
  ;(async () => {
    while (q.buf) {
      const chunk = q.buf
      q.buf = ''
      await api('term/input', { id, data: chunk }).catch(() => {})
    }
    q.busy = false
  })()
}

function showTerm(on = !T.shown) {
  T.shown = on
  renderTermBar()
  requestAnimationFrame(() => {
    fitActive()
    if (on) T.tabs.find(x => x.id === T.active)?.xt.focus()
  })
}

function activate(id) {
  T.active = id
  showTerm(true)
}

/** Open a terminal tab in the app: a shell, or one of laci's actions (resume, script, fix, summary). */
async function termOpen(d) {
  return mutate(async () => {
    const info = await api('term/open', { id: d.id, what: d.what ?? 'shell', arg: d.arg })
    const tab = addTab({ ...info, nodeId: d.id })
    activate(tab.id)
    if (d.what === 'fix') toast('Command typed, not run yet', 'Check it, then press Enter in the terminal.')
  })
}

async function termClose(id) {
  const i = T.tabs.findIndex(t => t.id === id)
  if (i < 0) return
  const [t] = T.tabs.splice(i, 1)
  t.es?.close()
  t.xt.dispose()
  t.host.remove()
  api('term/close', { id }).catch(() => {})
  if (T.active === id) T.active = T.tabs[Math.min(i, T.tabs.length - 1)]?.id ?? null
  if (!T.tabs.length) T.shown = false
  showTerm(T.shown)
}

function toggleTerm() {
  if (!T.tabs.length) return termOpen({ id: st.sel ?? st.cwd, what: 'shell' })
  showTerm()
}

async function restoreTerms() {
  if (!LIVE) return
  const list = await api('term/list').catch(() => [])
  for (const info of list) addTab(info)
  if (list.length) T.active = list.at(-1).id
  renderTermBar()
}

new ResizeObserver(() => fitActive()).observe(document.body)
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('[data-resize]')) return
  e.preventDefault()
  const box = $('#term')
  const move = ev => {
    const h = Math.min(window.innerHeight * 0.85, Math.max(140, window.innerHeight - ev.clientY))
    box.style.setProperty('--term-h', `${h}px`)
    T.max = false
    box.classList.remove('max')
    fitActive()
  }
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up) }
  addEventListener('pointermove', move)
  addEventListener('pointerup', up)
})

function paletteGo(id) {

    const n = nodes[id.slice(5)]

    select(n.id)
  } else if (id.startsWith('view:')) acts.view({ v: id.slice(5) })

document.addEventListener('click', e => {

  if (!a || a.disabled || a.closest('[disabled]')) return
  // A plain link or form control inside a clickable row does its own thing.
  const inner = e.target.closest('a, input, select')
  if (inner && inner !== a && a.contains(inner)) return
  acts[a.dataset.act]?.(a.dataset, e)
})

/** The connector form's fields, flattened into the shape the server checks. */
function connectorFromForm(f) {

  const link = {
    cwd: { kind: 'cwd', dir: d.cwd_dir, ext: d.cwd_ext, field: d.cwd_field },
    named: { kind: 'named', dir: d.named_dir, naming: d.named_naming },
    inside: { kind: 'inside', path: d.inside_path },
    mentions: { kind: 'mentions', dir: d.mentions_dir, ext: d.mentions_ext },
  }[d.kind]
  return { draft: d, body: { name: d.name, link } }
}
document.addEventListener('submit', async e => {
  const f = e.target
  if (f.dataset.form === 'connector') {
    e.preventDefault()
    const { draft, body } = connectorFromForm(f)
    if (!LIVE) return toast('Read-only preview', 'Start laci with `pnpm start` in ~/project/laci to make changes.')
    busy(`Adding ${body.name}…`)
    try {
      load(await api('connector/add', body))
      st.modal = null
      render()
      const c = snap.connectors.at(-1)
      toast(`Added ${c.name}`, c.present ? `Found ${plural(c.count, 'item')} in ${c.where}` : `Nothing at ${c.where} yet. It will show up once the tool writes there.`)
    } catch (err) {
      st.modal = { kind: 'connector', step: 'custom', draft, error: err.message }
      render()
    } finally {
      busy()
    }
    return
  }
  if (f.dataset.form !== 'todo') return
  e.preventDefault()
  const text = f.t.value.trim()
  if (!text) return
  mutate(async () => {
    patch(await api('todo', { id: f.dataset.id, op: 'add', text }))
    render()
    $('.add input')?.focus()
  })
})
document.addEventListener('keydown', e => {
  if (e.key === 'F4' || (e.ctrlKey && e.key === '`')) { e.preventDefault(); toggleTerm(); return }
  if (e.target.closest?.('.xterm')) return
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); st.palette = st.palette ? null : { q: '', i: 0 }; render(); return }
  if (e.key === 'Escape') { if (st.palette || st.modal) { st.palette = null; st.modal = null } else if (st.sel) st.sel = null; render(); return }
  if (st.palette) {
    const items = paletteItems(st.palette.q)
    if (e.key === 'ArrowDown') { e.preventDefault(); st.palette.i = Math.min(st.palette.i + 1, items.length - 1); render() }
    if (e.key === 'ArrowUp') { e.preventDefault(); st.palette.i = Math.max(st.palette.i - 1, 0); render() }
    if (e.key === 'Enter' && items[st.palette.i]) { e.preventDefault(); paletteGo(items[st.palette.i].id) }
    return
  }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return
  const row = e.target.closest?.('.main .item[tabindex]')
  if (!row) return
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault()
    const rows = [...document.querySelectorAll('.main .item[tabindex]')]
    rows[rows.indexOf(row) + (e.key === 'ArrowDown' ? 1 : -1)]?.focus()
  }
  if (e.key === 'Enter') { e.preventDefault(); const n = nodes[row.dataset.id]; if (n?.kind === 'folder' && st.view === 'folder') acts.cd({ id: n.id }); else row.click() }
  if (e.key === 'Backspace' && st.view === 'folder' && nodes[st.cwd].parent) acts.cd({ id: nodes[st.cwd].parent })
})

try { const t = localStorage.getItem('laci:theme'); if (t) document.documentElement.dataset.theme = t } catch {}
try {
  load(S ?? (await api('snapshot')))
} catch (e) {
  app.innerHTML = `<div class="boot"><div><b>Scan failed</b>${esc(e.message)}</div></div>`
  return
}
render()
refreshJournal()
restoreTerms()
})()
</script>
</body>
</html>
